name: Build and deploy website

on: 
  push:
    branches:
      - main
  workflow_dispatch:

jobs: 
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libbz2-dev \
            liblzma-dev \
            bzip2-doc \
            libgsl-dev \
            cmake \
            gsfonts \
            libcairo2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libglpk-dev \
            libjpeg-dev \
            libmagick++-dev \
            libpng-dev \
            libx11-dev \
            pandoc

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'

      - name: Setup renv
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Install quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        run: quarto render

      - name: Deploy to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages

